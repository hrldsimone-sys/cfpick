name: build-release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: freebsd
            goarch: amd64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
        shell: bash
        run: |
          OUT="cfpick-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then OUT="$OUT.exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o "$OUT" .
          ls -lh "$OUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cfpick-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cfpick-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
